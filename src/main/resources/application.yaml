spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: remindly
  datasource:
    url: jdbc:postgresql://localhost:54321/remindlydb?currentSchema=remindly
    username: remindly
    password: remindly
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  liquibase:
    default-schema: liquibase
    enabled: true
    change-log: classpath:/db/changelog/changelog.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  external-base-url: ${APP_EXTERNAL_BASE_URL}
  ntfy-server: ${NTFY_SERVER_URL}
  reminders:
    - id: errors
      topic: ${NTFY_ERRORS_TOPIC}
    - id: confirmation
      topic: ${NTFY_CONFIRMATION_TOPIC}
    - id: adhoc
      topic: ${NTFY_ADHOC_TOPIC}
  calendar:
    feed-token: ${ICAL_FEED_TOKEN:}
    alarm-trigger: ${ICAL_ALARM_TRIGGER:PT8H}
  gmail:
    credentials-file: ${GMAIL_CREDENTIALS_FILE}
    token-directory: ${GMAIL_TOKEN_DIRECTORY}
    auth-callback-url: ${GMAIL_AUTH_CALLBACK_BASE_URL}
